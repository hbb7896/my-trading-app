<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="웹과 안드로이드에서 함께 사용하는 거래 기록과 차트 복기 앱">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Trend Lab">
  <link rel="apple-touch-icon" href="icons/tm-apple-v1-180.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="tm-favicon-v1.png"/>

  <title>Trend Lab · 거래 복기</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1220">
  <style>
    html,body { margin:0; background:#0b1220; }
    #tm-launch { position:fixed; inset:0; z-index:9999; display:grid; place-content:center; gap:20px; text-align:center; background:#0b1220; color:#e7ebf2; font:500 15px system-ui,sans-serif; letter-spacing:.6px; transition:opacity .18s ease; }
    #tm-launch img { width:140px; height:140px; border-radius:30px; margin:auto; }
    #tm-launch.ready { opacity:0; pointer-events:none; }
    @media(prefers-reduced-motion:reduce) { #tm-launch { transition:none; } }
  </style>
</head>
<body>
  <div id="tm-launch" role="status" aria-label="Trading Master 시작 중">
    <img src="icons/tm-icon-v1-512.png" alt="TM" width="140" height="140">
    <span>Trading Master</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const launch = document.getElementById('tm-launch');
      if (!launch) return;
      launch.classList.add('ready');
      window.setTimeout(function () { launch.remove(); }, 200);
    }, {once:true});
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
